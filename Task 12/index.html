<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amr Diab Playlist</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <audio id="audio" ></audio>
    <div class="display">
        <img src="" alt="cover" id="cover">
        <div class="cont">
            <p class="tracktitle"></p>
            <input type="range" name="audioRange" id="audioRange" min="0" max="0">
            <div class="bts">
            <button id="play">Play</button>
            <button id="pause">Pause</button>
            <button id="stop">Stop</button>
            <input type="range" name="volRange" id="volRange" min="0" max="1" step="0.1">
            </div>
            <p class="so">Amr Diab</p>
        </div>
    </div>
    <div id="playlist"></div>
    <script src="index.js"></script>
</body>
</html>
