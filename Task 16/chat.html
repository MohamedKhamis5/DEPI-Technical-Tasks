<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Bar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div class="chat-bar">

    <div class="tools">
      <button class="plus" type="button"><i class="fa-solid fa-plus"></i></button>
      <button class="tool" type="button"><i class="fa-regular fa-image"></i></button>
      <button class="tool" type="button"><i class="fa-solid fa-paperclip"></i></button>
      <button class="tool" type="button"><i class="fa-solid fa-upload"></i></button>
    </div>

    <div class="message">
      <input type="text" placeholder="Type your message ...">
      <button class="emoji" type="button"><i class="fa-regular fa-face-smile"></i></button>
    </div>

    <button class="like" type="button"><i class="fa-solid fa-thumbs-up"></i></button>

  </div>
</body>
</html>
