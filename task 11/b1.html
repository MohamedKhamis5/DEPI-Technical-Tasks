<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A.1 - Window Object</title>
<style>
  body{ font-family: Segoe UI, Arial, sans-serif; max-width:600px; margin:40px auto; }
  button{ padding:8px 16px; font-size:1rem; cursor:pointer; }
</style>
</head>
<body>
  <h1>Parent Window</h1>
  <p>Click the button to open a child window. It will close itself automatically after 5 seconds.</p>
  <button onclick="openChild()">Open Child Window</button>

  <script>
    function openChild(){
      const child = window.open("./index.html", 'childWindow', 'width=420,height=250');

      if (!child) {
        alert('Popup was blocked! Please allow popups for this page and try again.');
        return;
      }

      child.document.write(`
        <html>
        <head><title>Child Window</title></head>
        <body style="font-family:Segoe UI, Arial, sans-serif; text-align:center; margin-top:60px;">
          <h2>Child Window</h2>
          <p>This window will close automatically in 5 seconds.</p>
        </body>
        </html>
      `);
      child.document.close();

      setTimeout(() => {
        if (!child.closed) child.close();
      }, 5000);
    }
  </script>
</body>
</html>
